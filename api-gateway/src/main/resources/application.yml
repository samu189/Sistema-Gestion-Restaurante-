server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ruta-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      management:
        endpoints:
          web:
            exposure:
              include: gateway