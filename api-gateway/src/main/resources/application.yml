server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**

        - id: ms-pedidos
          uri: http://localhost:8082
          predicates:
            - Path=/api/pedidos/**

        - id: ms-inventario
          uri: http://localhost:8083  # <--- Dirección directa al grano
          predicates:
            - Path=/api/inventario/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway