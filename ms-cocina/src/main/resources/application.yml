server:
  port: 8088

spring:
  application:
    name: ms-cocina
  datasource:
    url: jdbc:mysql://localhost:3306/db_cocina
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true