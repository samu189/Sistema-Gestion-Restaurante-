server:
  port: 8082

spring:
  application:
    name: MS-PEDIDOS
  datasource:
    # Si tienes contraseña en XAMPP, ponla en password. Si no, déjalo vacío.
    url: jdbc:mysql://localhost:3306/db_pedidos?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      eureka:
        instance:
          prefer-ip-address: true
        client:
          service-url:
            defaultZone: http://localhost:8761/eureka/