server:
  port: 8083

spring:
  application:
    name: ms-inventario
  datasource:
    url: jdbc:mysql://localhost:3306/db_inventario
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/db_inventario

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/