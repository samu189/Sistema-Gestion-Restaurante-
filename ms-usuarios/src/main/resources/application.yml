server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  datasource:
    url: jdbc:mysql://localhost:3306/db_usuarios
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/