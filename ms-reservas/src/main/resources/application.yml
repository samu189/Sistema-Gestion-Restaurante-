server:
  port: 8087

spring:
  application:
    name: ms-reservas
  datasource:
    url: jdbc:mysql://localhost:3306/db_reservas
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true